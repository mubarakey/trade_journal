<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="topbar">
        <h1>Trading Journal</h1>

        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Trades</a>
            <a href="#">Analytics</a>
        </nav>
    </header>

    <main>
        <section class="dashboard-header">

            <div>
                <h2>Dashboard</h2>

                <p>
                    Track your trading performance
                    and discipline.
                </p>
            </div>

            <button id="addTradeButton">
                + Add Trade
            </button>

        </section>

        <section class="stats-grid">

            <div class="stat-card">
                <h3>Total Trades</h3>
                <p id="totalTrades">0</p>
            </div>

            <div class="stat-card">
                <h3>Win Rate</h3>
                <p id="winRate">0%</p>
            </div>

            <div class="stat-card">
                <h3>Total R</h3>
                <p id="totalR">0R</p>
            </div>

            <div class="stat-card">
                <h3>Expectancy</h3>
                <p id="expectancy">0R</p>
            </div>

            <div class="stat-card">
                <h3>Profit Factor</h3>
                <p id="profitFactor">0</p>
            </div>

            <div class="stat-card">
                <h3>SMC Compliance</h3>
                <p id="smcCompliance">0%</p>
            </div>

        </section>


        <section class="recent-trades">

            <div class="section-header">
                <h2>Recent Trades</h2>

                <button id="viewTradesButton">
                    View All
                </button>
            </div>

            <div id="tradeList">
                <p>Loading trades...</p>
            </div>

        </section>

        <section class="trade-form-section">

    <h2>Add Trade</h2>

    <form id="tradeForm">

        <div class="form-group">
            <label for="pair">Pair</label>

            <input
                type="text"
                id="pair"
                placeholder="e.g. XAUUSD"
                required
            >
        </div>


        <div class="form-group">
            <label for="direction">Direction</label>

            <select id="direction" required>
                <option value="">Select direction</option>
                <option value="BUY">BUY</option>
                <option value="SELL">SELL</option>
            </select>
        </div>


        <div class="form-group">
            <label for="risk">Risk ($)</label>

            <input
                type="number"
                id="risk"
                step="0.01"
                placeholder="40"
                required
            >
        </div>


        <div class="form-group">
            <label for="resultR">Result (R)</label>

            <input
                type="number"
                id="resultR"
                step="0.01"
                placeholder="2"
                required
            >
        </div>


        <div class="form-group">
            <label for="entryType">Entry Type</label>

            <select id="entryType" required>

                <option value="">
                    Select entry type
                </option>

                <option value="failed_orderblock">
                    Failed Orderblock
                </option>

                <option value="fibonacci_zone">
                    Fibonacci Zone
                </option>

                <option value="supply_zone">
                    Supply Zone
                </option>

                <option value="demand_zone">
                    Demand Zone
                </option>

            </select>
        </div>


        <h3>SMC Conditions</h3>

        <div class="conditions">

            <label>
                <input
                    type="checkbox"
                    id="liquiditySweep"
                >
                Liquidity Sweep
            </label>

            <label>
                <input
                    type="checkbox"
                    id="bos"
                >
                BOS
            </label>

            <label>
                <input
                    type="checkbox"
                    id="structuralLiquidity"
                >
                Structural Liquidity
            </label>

            <label>
                <input
                    type="checkbox"
                    id="poi"
                >
                POI
            </label>

        </div>


        <div class="form-group">

            <label for="exitType">
                Exit Type
            </label>

            <select id="exitType" required>

                <option value="">
                    Select exit
                </option>

                <option value="TP">
                    TP
                </option>

                <option value="SL">
                    SL
                </option>

                <option value="BE">
                    BE
                </option>

                <option value="manual">
                    Manual
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="plannedTp">
                Planned TP (R)
            </label>

            <input
                type="number"
                id="plannedTp"
                step="0.1"
                placeholder="2"
                required
            >

        </div>


        <div class="form-group">

            <label>
                <input
                    type="checkbox"
                    id="mistake"
                >

                Mistake made?
            </label>

        </div>


        <div class="form-group">

            <label for="mistakeType">
                Mistake Type
            </label>

            <input
                type="text"
                id="mistakeType"
                placeholder="e.g. Early Exit"
            >

        </div>


        <button type="submit">
            Save Trade
        </button>

    </form>

    <p id="formMessage"></p>

</section>

    </main>



    <script src="./app.js"></script>

</body>

</html>
